name: Release

# Obsidian installs a plugin from a GitHub release whose tag is the exact
# version string in manifest.json — no leading "v".
on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Verify the tag matches manifest.json
        run: |
          TAG="${GITHUB_REF_NAME}"
          MANIFEST=$(node -p "require('./manifest.json').version")
          if [ "$TAG" != "$MANIFEST" ]; then
            echo "Tag '$TAG' does not match manifest.json version '$MANIFEST'."
            echo "Obsidian requires them to be identical. Run 'npm version <x.y.z>' and retag."
            exit 1
          fi
          echo "Releasing $TAG"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            main.js manifest.json
