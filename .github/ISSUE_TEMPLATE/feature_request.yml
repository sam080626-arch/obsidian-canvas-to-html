name: Feature request
description: Suggest something the exporter should do
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the situation, not only the feature you have in mind.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like it to do?
    validations:
      required: true

  - type: checkboxes
    id: constraints
    attributes:
      label: Please confirm you have considered these
      description: >
        The export is a single self-contained file that makes no network
        requests. Requests that break either property are unlikely to be
        accepted as-is, though there may be another way to get you what you need.
      options:
        - label: My request keeps the export as one self-contained file
        - label: My request does not require the exported file to fetch anything
